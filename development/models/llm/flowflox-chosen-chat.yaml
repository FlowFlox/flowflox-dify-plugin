model: flowflox-chosen-chat
label:
  en_US: "Chosen model — Chat"
model_type: llm
features: []
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: flowflox_model_id
    label:
      en_US: Try a specific Flox model
    type: string
    # Dify only persists a newly-entered model parameter when it is required.
    # The empty default remains the automatic Flox route.
    required: true
    default: ""
    help:
      en_US: "Turn this on to enter a live Flox model ID for this node. Leave it off and Flox chooses automatically."
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
