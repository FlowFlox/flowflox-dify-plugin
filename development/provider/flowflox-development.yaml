provider: flowflox-development
label:
  en_US: FlowFlox Development
description:
  en_US: "Routes requests only to the isolated FlowFlox development runtime."
icon_small:
  en_US: icon.svg
background: "#ECFDF5"
help:
  title:
    en_US: Set up FlowFlox Development
  url:
    en_US: https://flowflox.dev
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_base_url
      label:
        en_US: FlowFlox development connection URL
      type: text-input
      required: true
      placeholder:
        en_US: http://development-preview.internal/v1
    - variable: api_key
      label:
        en_US: FlowFlox development runtime service credential
      type: secret-input
      required: true
      placeholder:
        en_US: ffx_svc_… development runtime-only credential
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
    position: "models/llm/_position.yaml"
  text_embedding:
    predefined:
      - "models/text_embedding/*.yaml"
    position: "models/text_embedding/_position.yaml"
extra:
  python:
    provider_source: provider/flowflox.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
