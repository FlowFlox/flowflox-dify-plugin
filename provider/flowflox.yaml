provider: flowflox
label:
  en_US: FlowFlox
description:
  en_US: "Routes each request to a live, compatible FlowFlox model."
icon_small:
  en_US: icon.svg
background: "#EEF4FF"
help:
  title:
    en_US: Set up FlowFlox
  url:
    en_US: https://gateway.flowflox.dev/v1
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_base_url
      label:
        en_US: FlowFlox connection URL
      type: text-input
      required: true
      placeholder:
        en_US: https://gateway.flowflox.dev/v1
    - variable: api_key
      label:
        en_US: FlowFlox Dify workspace connection token
      type: secret-input
      required: true
      placeholder:
        en_US: Platform-managed Dify gateway token
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
    position: "models/llm/_position.yaml"
  text_embedding:
    predefined:
      # Dify 1.16 expands the ordering file when a wildcard is used here,
      # producing a duplicate embedding entry. Keep the single supported
      # embedding model explicit instead.
      - "models/text_embedding/embeddinggemma-300m.yaml"
extra:
  python:
    provider_source: provider/flowflox.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
