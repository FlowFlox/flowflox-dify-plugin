provider: flowflox
label:
  en_US: FlowFlox
description:
  en_US: "Routes each request to a live, compatible FlowFlox model."
icon_small:
  en_US: icon.svg
background: "#EEF4FF"
help:
  title:
    en_US: Set up FlowFlox
  url:
    en_US: https://gateway.flowflox.dev/v1
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_base_url
      label:
        en_US: FlowFlox connection URL
      type: text-input
      required: true
      placeholder:
        en_US: https://gateway.flowflox.dev/v1
    - variable: api_key
      label:
        en_US: FlowFlox connection key
      type: secret-input
      required: true
      placeholder:
        en_US: Server-only FlowFlox connection key
    - variable: test_model
      label:
        en_US: Model to try (optional)
      type: text-input
      required: false
      placeholder:
        en_US: A FlowFlox model ID
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
    position: "models/llm/_position.yaml"
extra:
  python:
    provider_source: provider/flowflox.py
    model_sources:
      - models/llm/llm.py
