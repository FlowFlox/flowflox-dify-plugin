name: Publish signed Dify package

on:
  push:
    tags:
      - "v*"
      - "tools-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the pinned Dify CLI
        run: |
          set -euo pipefail
          mkdir -p .bin
          curl --fail --location --silent --show-error \
            --output .bin/dify \
            https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.4/dify-plugin-linux-amd64
          echo "5c63341c6d466d7126e41a4f39a7e73a54ff7aab0f28463a726590ae5b8d6f1c  .bin/dify" | sha256sum --check
          chmod +x .bin/dify

      - name: Package and verify the signed plugin
        env:
          FLOWFLOX_DIFY_SIGNING_PRIVATE_KEY: ${{ secrets.FLOWFLOX_DIFY_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$FLOWFLOX_DIFY_SIGNING_PRIVATE_KEY"
          signing_key="$RUNNER_TEMP/flowflox-dify.private.pem"
          printf '%s' "$FLOWFLOX_DIFY_SIGNING_PRIVATE_KEY" > "$signing_key"
          verification_key="signing/flowflox-dify.public.pem"
          # Dify's GitHub updater only accepts semantic release tags. The
          # 0.2 release line belongs to the separate FlowFlox Tools plugin;
          # the existing 0.1 line remains the model-provider plugin.
          if [[ "$GITHUB_REF_NAME" == tools-v* || "$GITHUB_REF_NAME" == v0.2.* || "$GITHUB_REF_NAME" == v0.3.* ]]; then
            if [[ "$GITHUB_REF_NAME" == tools-v* ]]; then
              version="${GITHUB_REF_NAME#tools-v}"
            else
              version="${GITHUB_REF_NAME#v}"
            fi
            plugin_dir="tools"
            package_name="flowflox-tools"
            release_title="FlowFlox Tools for Dify $GITHUB_REF_NAME"
          else
            version="${GITHUB_REF_NAME#v}"
            plugin_dir="."
            package_name="flowflox-model-provider"
            release_title="FlowFlox for Dify $GITHUB_REF_NAME"
          fi

          manifest_version="$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).fetch("version")' "$plugin_dir/manifest.yaml")"
          test "$version" = "$manifest_version"

          release_work_dir="$(mktemp -d)"
          trap 'rm -rf "$release_work_dir" "$signing_key"' EXIT
          mkdir "$release_work_dir/plugin"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.bin' --exclude='dist' --exclude='*.difypkg' --exclude='__pycache__' "$plugin_dir/" "$release_work_dir/plugin/"

          ./.bin/dify plugin package "$release_work_dir/plugin" -o "$release_work_dir/$package_name-$version.difypkg"
          ./.bin/dify signature sign "$release_work_dir/$package_name-$version.difypkg" -p "$signing_key" -c partner
          ./.bin/dify signature verify "$release_work_dir/$package_name-$version.signed.difypkg" -p "$verification_key"

          mkdir -p dist
          cp "$release_work_dir/$package_name-$version.signed.difypkg" "dist/$package_name-$version.signed.difypkg"

      - name: Publish the signed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == tools-v* || "$GITHUB_REF_NAME" == v0.2.* || "$GITHUB_REF_NAME" == v0.3.* ]]; then
            if [[ "$GITHUB_REF_NAME" == tools-v* ]]; then
              version="${GITHUB_REF_NAME#tools-v}"
            else
              version="${GITHUB_REF_NAME#v}"
            fi
            package_name="flowflox-tools"
            release_title="FlowFlox Tools for Dify $GITHUB_REF_NAME"
          else
            version="${GITHUB_REF_NAME#v}"
            package_name="flowflox-model-provider"
            release_title="FlowFlox for Dify $GITHUB_REF_NAME"
          fi

          gh release create "$GITHUB_REF_NAME" "dist/$package_name-$version.signed.difypkg" \
            --title "$release_title" \
            --generate-notes

      - name: Retire legacy tools release tags
        if: github.ref_name == 'v0.2.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # These releases predate Dify's semantic-tag updater and have been
          # superseded by the v0.2.x tools releases above.
          gh release delete tools-v0.2.0 --yes --cleanup-tag
          gh release delete tools-v0.2.1 --yes --cleanup-tag
