identity:
  name: connect_app
  author: flowflox
  label:
    en_US: Authorize FlowFlox app
description:
  human:
    en_US: Bind a one-time FlowFlox authorization code to this Dify app only.
  llm: One-time app setup only. Run this direct Tool node after FlowFlox issues an authorization code for this saved Dify app. It exchanges the code for a narrow app capability before the FlowFlox API catalog or action gateway can run. Never add this tool to an Agent or connect it to the user-request path.
parameters:
  - name: flowflox_authorization_code
    type: secret-input
    required: true
    label:
      en_US: One-time Dify authorization code
    human_description:
      en_US: Paste the ffx_dac_ code issued in FlowFlox for this exact saved Dify app. It expires in 10 minutes and cannot be used again.
    form: form
extra:
  python:
    source: tools/connect_app.py
output_schema:
  type: object
  properties:
    connected:
      type: boolean
    connection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        app_id:
          type: string
    approved_action_count:
      type: integer
    error:
      type: [string, 'null']
