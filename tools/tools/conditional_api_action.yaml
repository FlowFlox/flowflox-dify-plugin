identity:
  name: conditional_api_action
  author: flowflox
  label:
    en_US: FlowFlox conditional API action
description:
  human:
    en_US: Run one approved API only when a workflow branch reaches this node.
  llm: This is a branch step, not a default action. Use it only after an upstream router, condition, or prior action has selected the exact approved operation and supplied its JSON input. Its structured data can feed another FlowFlox conditional API action, an AI review node, a document action, or a final response. Never call an API merely because a user message arrived or because the API is available.
parameters:
  - name: dify_app_id
    type: string
    required: false
    label:
      en_US: Dify app context
    human_description:
      en_US: Bind to the system App ID (sys.app_id) for this canvas. The model never selects this value.
    form: form
  - name: operation
    type: string
    required: true
    label:
      en_US: Approved MCP action
    human_description:
      en_US: Bind the exact MCP action name from FlowFlox API catalog, for example flowflox_test_runtime_diagnostics.
    llm_description: The exact MCP action name returned by FlowFlox API catalog and selected by the preceding router or condition. Do not invent an action name.
    form: llm
  - name: arguments_json
    type: string
    required: false
    label:
      en_US: Selected JSON input
    human_description:
      en_US: Bind a JSON object assembled from the preceding branch or API output. Use {} when the operation takes no input.
    llm_description: A compact JSON object assembled from the preceding branch or API output. Use {} when the operation takes no input.
    form: llm
extra:
  python:
    source: tools/conditional_api_action.py
output_schema:
  type: object
  properties:
    ok:
      type: boolean
    operation:
      type: string
    action:
      type: object
    data: {}
    text:
      type: string
    error:
      type: [string, 'null']
