identity:
  name: call_approved_api
  author: flowflox
  label:
    en_US: FlowFlox MCP action gateway
description:
  human:
    en_US: Dynamically call one approved FlowFlox MCP tool from an Agent or a routed workflow.
  llm: >-
    Treat FlowFlox MCP tools as optional capabilities, never as default pre-processing. First decide whether the user's request actually requires a tool. Use the FlowFlox MCP tool catalog when the operation or input schema is not already in this conversation. Call only an exact operation name returned by that catalog, then pass a valid JSON object that matches its input schema. You may call one or more tools in sequence when an earlier safe result is needed by a later tool or an AI review. The returned `data` is safe structured output for the next step. This action never accepts raw SQL, database credentials, cloud credentials, or a tenant selector.
parameters:
  # The Agent receives this as a Dify-resolved form value, not as a tool-call
  # schema field. Keep it bound to sys.app_id for this canvas.
  - name: dify_app_id
    type: string
    # Keep this as a required form value so Dify exposes its system-variable
    # picker to the canvas owner. It is resolved by Dify, never by the model.
    required: true
    label:
      en_US: Dify app context
    human_description:
      en_US: Bind once to the system App ID (sys.app_id). This selects this app's revocable FlowFlox capability and is never shown to the AI.
    form: form
  - name: operation
    type: string
    required: true
    label:
      en_US: Approved MCP action
    human_description:
      en_US: The exact MCP action name returned by FlowFlox MCP tool catalog, for example flowflox_test_hello_world.
    llm_description: Exact operation name returned by FlowFlox MCP tool catalog, for example flowflox_test_hello_world.
    form: llm
  - name: arguments_json
    type: string
    required: false
    label:
      en_US: JSON arguments
    human_description:
      en_US: A JSON object matching the selected operation's input schema. Use {} when it has no inputs.
    llm_description: A compact JSON object matching the selected operation input schema. Use {} when there are no inputs.
    form: llm
extra:
  python:
    source: tools/call_approved_api.py
output_schema:
  type: object
  properties:
    ok:
      type: boolean
    operation:
      type: string
    action:
      type: object
    data: {}
    text:
      type: string
    error:
      type: [string, 'null']
