model: flowflox-auto-tools
label:
  en_US: "Automatic — Tools"
model_type: llm
features:
  - tool-call
  # Dify's FunctionCalling strategy only requests streamed chunks when this
  # capability is declared. Without it, the agent deliberately invokes the
  # model with `stream=False` and Flox receives the complete response at once.
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
