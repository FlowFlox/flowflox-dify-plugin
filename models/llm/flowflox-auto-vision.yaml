model: flowflox-auto-vision
label:
  en_US: "Flox — Vision"
model_type: llm
features:
  - vision
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
